name: pi05-infer

services:
  tb6r5_policy_server:
    image: ${IMAGE_NAME:-openpi_tb6r5_policy_server:orin-jp62}
    pull_policy: never
    init: true
    tty: true
    restart: unless-stopped
    network_mode: host
    shm_size: 8gb
    runtime: nvidia
    stop_grace_period: 30s
    volumes:
      - ${CHECKPOINT_HOST_DIR:-/home/ai/pi0.5/model/pytorch/pp_white_red/19999}:${CHECKPOINT_CONTAINER_DIR:-/models/pi05_tb6r5}:ro
      - ${OPENPI_DATA_HOME:-/home/ai/pi0.5/pi05_infer/cache/openpi}:/openpi_assets
      - /home/ai/pi0.5/pi05_infer/compat_serve_policy.py:/opt/tb6r5/compat_serve_policy.py:ro
      - /home/ai/pi0.5/pi05_infer/docker_source/src/openpi:/app/src/openpi:ro
      - /home/ai/pi0.5/pi05_infer/docker_source/scripts:/app/scripts:ro
      - /home/ai/pi0.5/pi05_infer/docker_source/packages/openpi-client/src/openpi_client:/app/packages/openpi-client/src/openpi_client:ro
    environment:
      OPENPI_DATA_HOME: /openpi_assets
      OPENPI_DISABLE_TORCH_COMPILE: ${OPENPI_DISABLE_TORCH_COMPILE:-1}
      JAX_PLATFORMS: cpu
      IS_DOCKER: "true"
      POLICY_PORT: ${POLICY_PORT:-8002}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    entrypoint:
      - python
      - /opt/tb6r5/compat_serve_policy.py
    command:
      - --port
      - ${POLICY_PORT:-8002}
      - policy:checkpoint
      - --policy.config=${POLICY_CONFIG:-pi05_tb6r5}
      - --policy.dir=${CHECKPOINT_CONTAINER_DIR:-/models/pi05_tb6r5}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ["POLICY_PORT"]}/healthz', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5m

  tb6r5_placeholder_policy_server:
    profiles: ["placeholder"]
    image: ${IMAGE_NAME:-openpi_tb6r5_policy_server:orin-jp62}
    pull_policy: never
    init: true
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 10s
    volumes:
      - /home/ai/pi0.5/pi05_infer/mock_policy_server.py:/opt/tb6r5/mock_policy_server.py:ro
    environment:
      POLICY_PORT: ${POLICY_PORT:-8002}
      MOCK_ACTION_HORIZON: ${MOCK_ACTION_HORIZON:-10}
    entrypoint:
      - python
      - /opt/tb6r5/mock_policy_server.py
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ["POLICY_PORT"]}/healthz', timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
