name: pi05-jax

services:
  tb6r5_jax_policy_server:
    # Jetson JAX CUDA image, built from jax_gpu_build/Dockerfile.runtime.
    image: ${JAX_IMAGE:-jax-orin:0.5.3-cuda}
    pull_policy: never
    init: true
    network_mode: host
    runtime: nvidia
    shm_size: 8gb
    volumes:
      - ${JAX_CHECKPOINT_DIR:-/home/ai/pi0.5/model/jax/pi05_pp_white_red_h50/19999}:/models/pi05_tb6r5:ro
      - ./jax_infer.py:/opt/tb6r5/jax_infer.py:ro
      - ./checkpoint_config.py:/opt/tb6r5/checkpoint_config.py:ro
      # The RTC OpenPI source and websocket client are committed in this repo.
      - ./rtc_stage/openpi:/app/src/openpi:ro
      - ./docker_source/packages/openpi-client/src/openpi_client:/app/packages/openpi-client/src/openpi_client:ro
      - ${OPENPI_DATA_HOME:-/home/ai/pi0.5/pi05_infer/cache/openpi}:/openpi_assets
    environment:
      OPENPI_ROOT: /app
      OPENPI_DATA_HOME: /openpi_assets
      JAX_PLATFORMS: cuda
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      POLICY_PORT: ${JAX_POLICY_PORT:-8003}
    entrypoint: [python, /opt/tb6r5/jax_infer.py]
    command:
      - serve
      - --checkpoint=/models/pi05_tb6r5
      - --config=${POLICY_CONFIG:-auto}
      - --asset-id=.
      - --device=gpu
      - --host=0.0.0.0
      - --port=${JAX_POLICY_PORT:-8003}
      - --num-steps=${JAX_NUM_STEPS:-10}
      - --allow-hardware
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ["POLICY_PORT"]}/healthz', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5m
